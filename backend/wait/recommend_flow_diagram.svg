<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560"
     font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4A5568"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#276749"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#C05621"/>
    </marker>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4299E1"/><stop offset="100%" stop-color="#2B6CB0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BAE43"/><stop offset="100%" stop-color="#3D6B21"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9F7AEA"/><stop offset="100%" stop-color="#553C9A"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6AD55"/><stop offset="100%" stop-color="#C05621"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78"/><stop offset="100%" stop-color="#276749"/>
    </linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FC8181"/><stop offset="100%" stop-color="#9B2335"/>
    </linearGradient>
  </defs>

  <rect width="860" height="560" fill="#F7FAFC" rx="12"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A202C">推荐接口调用流程图</text>
  <text x="430" y="54" text-anchor="middle" font-size="12" fill="#718096">GET /api/recommend?k=10 全链路时序</text>
  <line x1="50" y1="64" x2="810" y2="64" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Step nodes (left-aligned vertical flow) -->
  <!-- 1 -->
  <rect x="260" y="80" width="340" height="52" rx="10" fill="url(#g1)" filter="url(#sh)"/>
  <text x="430" y="102" text-anchor="middle" font-size="13" fill="white" font-weight="bold">① 用户请求</text>
  <text x="430" y="120" text-anchor="middle" font-size="11" fill="#BEE3F8">GET /api/recommend?k=10 + Authorization: Bearer &lt;token&gt;</text>

  <line x1="430" y1="132" x2="430" y2="154" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2 JWT -->
  <rect x="260" y="157" width="340" height="52" rx="10" fill="url(#g3)" filter="url(#sh)"/>
  <text x="430" y="179" text-anchor="middle" font-size="13" fill="white" font-weight="bold">② JWT 过滤器认证</text>
  <text x="430" y="197" text-anchor="middle" font-size="11" fill="#E9D8FD">解析 Token → 提取 userId · role → 注入 SecurityContext</text>

  <line x1="430" y1="209" x2="430" y2="231" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3 Controller -->
  <rect x="260" y="234" width="340" height="52" rx="10" fill="url(#g2)" filter="url(#sh)"/>
  <text x="430" y="256" text-anchor="middle" font-size="13" fill="white" font-weight="bold">③ RecommendController</text>
  <text x="430" y="274" text-anchor="middle" font-size="11" fill="#D1FAE5">获取 userId，调用 RecommendService.getRecommendations()</text>

  <line x1="430" y1="286" x2="430" y2="308" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4 Service -->
  <rect x="200" y="311" width="460" height="62" rx="10" fill="url(#g2)" filter="url(#sh)"/>
  <text x="430" y="333" text-anchor="middle" font-size="13" fill="white" font-weight="bold">④ RecommendService（核心编排）</text>
  <text x="430" y="350" text-anchor="middle" font-size="11" fill="#D1FAE5">1. 查询用户历史行为（behavior_log）</text>
  <text x="430" y="365" text-anchor="middle" font-size="11" fill="#D1FAE5">2. 将 paper_id 转为 AMiner ID 列表</text>

  <line x1="430" y1="373" x2="430" y2="395" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 5 Python Client -->
  <rect x="200" y="398" width="460" height="52" rx="10" fill="url(#g4)" filter="url(#sh)"/>
  <text x="430" y="420" text-anchor="middle" font-size="13" fill="white" font-weight="bold">⑤ PythonRecClient</text>
  <text x="430" y="438" text-anchor="middle" font-size="11" fill="#FEFCBF">RestTemplate → POST http://localhost:8000/recommend</text>

  <!-- Fork: Python available or not -->
  <line x1="430" y1="450" x2="430" y2="472" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Diamond decision -->
  <polygon points="430,472 530,497 430,522 330,497" fill="white" stroke="#4A5568" stroke-width="2" filter="url(#sh)"/>
  <text x="430" y="492" text-anchor="middle" font-size="12" fill="#2D3748">Python 服务</text>
  <text x="430" y="508" text-anchor="middle" font-size="12" fill="#2D3748">可用？</text>

  <!-- Yes branch -->
  <line x1="530" y1="497" x2="660" y2="497" stroke="#276749" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="590" y="490" font-size="11" fill="#276749" font-weight="bold">是</text>
  <rect x="660" y="474" width="150" height="46" rx="8" fill="url(#g5)" filter="url(#sh)"/>
  <text x="735" y="495" text-anchor="middle" font-size="11" fill="white" font-weight="bold">组装推荐结果</text>
  <text x="735" y="511" text-anchor="middle" font-size="10" fill="#C6F6D5">补全论文详情</text>

  <!-- No branch -->
  <line x1="330" y1="497" x2="200" y2="497" stroke="#C05621" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="257" y="490" font-size="11" fill="#C05621" font-weight="bold">否</text>
  <rect x="50" y="474" width="150" height="46" rx="8" fill="url(#g6)" filter="url(#sh)"/>
  <text x="125" y="495" text-anchor="middle" font-size="11" fill="white" font-weight="bold">降级策略</text>
  <text x="125" y="511" text-anchor="middle" font-size="10" fill="#FED7D7">热门论文推荐</text>

  <!-- Both converge to response -->
  <line x1="735" y1="520" x2="735" y2="550" stroke="#4A5568" stroke-width="1.5"/>
  <line x1="125" y1="520" x2="125" y2="550" stroke="#4A5568" stroke-width="1.5"/>
  <line x1="125" y1="550" x2="735" y2="550" stroke="#4A5568" stroke-width="1.5"/>
  <line x1="430" y1="550" x2="430" y2="570" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Final response box -->
  <rect x="200" y="572" width="460" height="46" rx="10" fill="url(#g1)" filter="url(#sh)"/>
  <text x="430" y="592" text-anchor="middle" font-size="13" fill="white" font-weight="bold">⑥ 统一响应格式返回前端</text>
  <text x="430" y="608" text-anchor="middle" font-size="11" fill="#BEE3F8">Result&lt;RecommendResponse&gt; { code:0, data: { recommendations:[...] } }</text>

  <!-- Timing annotations -->
  <rect x="50" y="80" width="196" height="130" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="148" y="100" text-anchor="middle" font-size="11" fill="#4A5568" font-weight="bold">时延预算</text>
  <text x="68" y="118" font-size="10" fill="#718096">JWT 过滤器</text>
  <text x="200" y="118" text-anchor="end" font-size="10" fill="#4A5568">&lt; 1ms</text>
  <text x="68" y="135" font-size="10" fill="#718096">历史行为查询</text>
  <text x="200" y="135" text-anchor="end" font-size="10" fill="#4A5568">&lt; 5ms</text>
  <text x="68" y="152" font-size="10" fill="#718096">Python 推荐服务</text>
  <text x="200" y="152" text-anchor="end" font-size="10" fill="#4A5568">~30ms</text>
  <text x="68" y="169" font-size="10" fill="#718096">论文详情组装</text>
  <text x="200" y="169" text-anchor="end" font-size="10" fill="#4A5568">&lt; 5ms</text>
  <line x1="68" y1="178" x2="200" y2="178" stroke="#E2E8F0"/>
  <text x="68" y="194" font-size="10" fill="#2D3748" font-weight="bold">总计</text>
  <text x="200" y="194" text-anchor="end" font-size="10" fill="#276749" font-weight="bold">&lt; 50ms</text>
</svg>
