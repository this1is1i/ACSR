<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000025"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#64748B"/></marker>
    <marker id="arrC" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F59E0B"/></marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#10B981"/></marker>
    <marker id="arrP" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#8B5CF6"/></marker>
    <marker id="arrB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3B82F6"/></marker>
  </defs>

  <rect width="900" height="620" fill="#0F172A" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#F1F5F9">科研知识图谱结构图</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#64748B">节点：Paper · Author · Keyword · Venue　｜　边：author_of · cite · has_keyword · publish_in · co_author</text>

  <!-- ── Paper 节点（中心大节点） ── -->
  <circle cx="450" cy="290" r="42" fill="#1E3A5F" stroke="#3B82F6" stroke-width="2.5" filter="url(#glow)"/>
  <text x="450" y="285" text-anchor="middle" font-size="13" fill="#93C5FD" font-weight="bold">Paper</text>
  <text x="450" y="301" text-anchor="middle" font-size="10" fill="#64748B">Actor-Critic Survey</text>
  <text x="450" y="314" text-anchor="middle" font-size="10" fill="#64748B">2023 · NeurIPS</text>

  <!-- ── Author 节点 ── -->
  <circle cx="155" cy="200" r="34" fill="#1A2E1A" stroke="#10B981" stroke-width="2" filter="url(#s)"/>
  <text x="155" y="196" text-anchor="middle" font-size="12" fill="#6EE7B7" font-weight="bold">Author</text>
  <text x="155" y="211" text-anchor="middle" font-size="10" fill="#64748B">Li Wei · MIT</text>

  <circle cx="155" cy="380" r="34" fill="#1A2E1A" stroke="#10B981" stroke-width="2" filter="url(#s)"/>
  <text x="155" y="376" text-anchor="middle" font-size="12" fill="#6EE7B7" font-weight="bold">Author</text>
  <text x="155" y="391" text-anchor="middle" font-size="10" fill="#64748B">Zhang Yu · CMU</text>

  <!-- ── Keyword 节点 ── -->
  <circle cx="660" cy="150" r="30" fill="#2D1B69" stroke="#8B5CF6" stroke-width="2" filter="url(#s)"/>
  <text x="660" y="145" text-anchor="middle" font-size="11" fill="#C4B5FD" font-weight="bold">Keyword</text>
  <text x="660" y="160" text-anchor="middle" font-size="10" fill="#64748B">Reinf. Learning</text>

  <circle cx="760" cy="240" r="28" fill="#2D1B69" stroke="#8B5CF6" stroke-width="2" filter="url(#s)"/>
  <text x="760" y="235" text-anchor="middle" font-size="11" fill="#C4B5FD" font-weight="bold">Keyword</text>
  <text x="760" y="249" text-anchor="middle" font-size="10" fill="#64748B">Actor-Critic</text>

  <circle cx="720" cy="370" r="28" fill="#2D1B69" stroke="#8B5CF6" stroke-width="2" filter="url(#s)"/>
  <text x="720" y="365" text-anchor="middle" font-size="11" fill="#C4B5FD" font-weight="bold">Keyword</text>
  <text x="720" y="379" text-anchor="middle" font-size="10" fill="#64748B">Policy Gradient</text>

  <!-- ── Venue 节点 ── -->
  <circle cx="450" cy="510" r="32" fill="#1A1A2E" stroke="#F59E0B" stroke-width="2" filter="url(#s)"/>
  <text x="450" y="505" text-anchor="middle" font-size="12" fill="#FCD34D" font-weight="bold">Venue</text>
  <text x="450" y="520" text-anchor="middle" font-size="11" fill="#64748B">NeurIPS 2023</text>

  <!-- ── Related Paper 节点（cite） ── -->
  <circle cx="280" cy="120" r="30" fill="#1E2A3F" stroke="#3B82F6" stroke-width="1.5" filter="url(#s)"/>
  <text x="280" y="115" text-anchor="middle" font-size="11" fill="#93C5FD" font-weight="bold">Paper</text>
  <text x="280" y="130" text-anchor="middle" font-size="10" fill="#64748B">DQN Survey</text>

  <circle cx="620" cy="480" r="30" fill="#1E2A3F" stroke="#3B82F6" stroke-width="1.5" filter="url(#s)"/>
  <text x="620" y="475" text-anchor="middle" font-size="11" fill="#93C5FD" font-weight="bold">Paper</text>
  <text x="620" y="490" text-anchor="middle" font-size="10" fill="#64748B">PPO 2017</text>

  <circle cx="310" cy="460" r="30" fill="#1E2A3F" stroke="#3B82F6" stroke-width="1.5" filter="url(#s)"/>
  <text x="310" y="455" text-anchor="middle" font-size="11" fill="#93C5FD" font-weight="bold">Paper</text>
  <text x="310" y="470" text-anchor="middle" font-size="10" fill="#64748B">A3C Paper</text>

  <!-- ── Edges ── -->
  <!-- author_of: Author → Paper (green) -->
  <line x1="186" y1="210" x2="409" y2="267" stroke="#10B981" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="270" y="228" font-size="10" fill="#10B981">author_of</text>

  <line x1="185" y1="368" x2="410" y2="308" stroke="#10B981" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="256" y="352" font-size="10" fill="#10B981">author_of</text>

  <!-- co_author: Author ↔ Author (dashed green) -->
  <line x1="155" y1="234" x2="155" y2="346" stroke="#10B981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrG)"/>
  <text x="100" y="292" font-size="10" fill="#10B981">co_author</text>

  <!-- cite: Paper → Paper (orange/amber) -->
  <line x1="423" y1="258" x2="306" y2="148" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrC)"/>
  <text x="340" y="195" font-size="10" fill="#F59E0B">cite</text>

  <line x1="468" y1="330" x2="333" y2="442" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrC)"/>
  <text x="374" y="400" font-size="10" fill="#F59E0B">cite</text>

  <line x1="476" y1="325" x2="597" y2="454" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrC)"/>
  <text x="558" y="378" font-size="10" fill="#F59E0B">cite</text>

  <!-- has_keyword: Paper → Keyword (purple) -->
  <line x1="490" y1="261" x2="632" y2="172" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrP)"/>
  <text x="570" y="207" font-size="10" fill="#8B5CF6">has_keyword</text>

  <line x1="492" y1="271" x2="733" y2="244" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrP)"/>
  <text x="634" y="251" font-size="10" fill="#8B5CF6">has_keyword</text>

  <line x1="488" y1="328" x2="695" y2="353" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrP)"/>
  <text x="604" y="334" font-size="10" fill="#8B5CF6">has_keyword</text>

  <!-- publish_in: Paper → Venue (amber) -->
  <line x1="450" y1="332" x2="450" y2="478" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arrC)"/>
  <text x="460" y="408" font-size="10" fill="#F59E0B">publish_in</text>

  <!-- ── 图例 ── -->
  <rect x="30" y="492" width="220" height="118" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="140" y="512" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="bold">图例</text>
  <circle cx="52" cy="530" r="7" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="65" y="534" font-size="10" fill="#93C5FD">Paper 论文节点</text>
  <circle cx="52" cy="550" r="7" fill="#1A2E1A" stroke="#10B981" stroke-width="1.5"/>
  <text x="65" y="554" font-size="10" fill="#6EE7B7">Author 作者节点</text>
  <circle cx="52" cy="570" r="7" fill="#2D1B69" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="65" y="574" font-size="10" fill="#C4B5FD">Keyword 关键词节点</text>
  <circle cx="52" cy="590" r="7" fill="#1A1A2E" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="65" y="594" font-size="10" fill="#FCD34D">Venue 发表场所节点</text>
</svg>
