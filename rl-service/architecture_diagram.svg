<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/></filter>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4299E1"/><stop offset="100%" stop-color="#2B6CB0"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78"/><stop offset="100%" stop-color="#276749"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9F7AEA"/><stop offset="100%" stop-color="#553C9A"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6AD55"/><stop offset="100%" stop-color="#C05621"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38B2AC"/><stop offset="100%" stop-color="#1D4044"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FC8181"/><stop offset="100%" stop-color="#9B2335"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#4A5568"/>
    </marker>
    <marker id="arrW" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#718096"/>
    </marker>
  </defs>

  <!-- BG -->
  <rect width="1000" height="780" fill="#F7FAFC" rx="12"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A202C">科研推荐系统整体架构图</text>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#718096">基于 Actor-Critic 强化学习 · Top-K 推荐 · REST API</text>
  <line x1="60" y1="68" x2="940" y2="68" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ── LAYER 1: 外部调用层 ── -->
  <rect x="60" y="82" width="880" height="68" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#s)"/>
  <text x="90" y="102" font-size="11" fill="#718096" font-weight="bold">外部调用层</text>

  <rect x="140" y="95" width="160" height="44" rx="8" fill="url(#gBlue)" filter="url(#s)"/>
  <text x="220" y="116" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Spring Boot</text>
  <text x="220" y="131" text-anchor="middle" font-size="10" fill="#BEE3F8">HTTP POST /recommend</text>

  <rect x="340" y="95" width="160" height="44" rx="8" fill="url(#gBlue)" filter="url(#s)"/>
  <text x="420" y="116" text-anchor="middle" font-size="12" fill="white" font-weight="bold">前端 Web/App</text>
  <text x="420" y="131" text-anchor="middle" font-size="10" fill="#BEE3F8">user_id + k → 推荐结果</text>

  <rect x="540" y="95" width="160" height="44" rx="8" fill="url(#gBlue)" filter="url(#s)"/>
  <text x="620" y="116" text-anchor="middle" font-size="12" fill="white" font-weight="bold">测试脚本 / cURL</text>
  <text x="620" y="131" text-anchor="middle" font-size="10" fill="#BEE3F8">POST /train · GET /model/info</text>

  <rect x="740" y="95" width="160" height="44" rx="8" fill="#2D3748" filter="url(#s)"/>
  <text x="820" y="116" text-anchor="middle" font-size="12" fill="white" font-weight="bold">健康检查</text>
  <text x="820" y="131" text-anchor="middle" font-size="10" fill="#A0AEC0">GET /health · K8s Probe</text>

  <!-- ── LAYER 2: API层 ── -->
  <!-- arrows down -->
  <line x1="220" y1="139" x2="220" y2="163" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="139" x2="420" y2="163" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="139" x2="620" y2="163" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="820" y1="139" x2="820" y2="163" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="60" y="166" width="880" height="72" rx="8" fill="#EBF8FF" stroke="#4299E1" stroke-width="1.5" filter="url(#s)"/>
  <text x="90" y="186" font-size="11" fill="#2B6CB0" font-weight="bold">API 服务层（FastAPI）  api/server.py</text>
  <rect x="130" y="192" width="168" height="36" rx="6" fill="url(#gBlue)"/>
  <text x="214" y="208" text-anchor="middle" font-size="11" fill="white" font-weight="bold">POST /recommend</text>
  <text x="214" y="222" text-anchor="middle" font-size="10" fill="#BEE3F8">Top-K 推荐接口</text>
  <rect x="316" y="192" width="168" height="36" rx="6" fill="url(#gBlue)"/>
  <text x="400" y="208" text-anchor="middle" font-size="11" fill="white" font-weight="bold">POST /train</text>
  <text x="400" y="222" text-anchor="middle" font-size="10" fill="#BEE3F8">异步触发训练</text>
  <rect x="502" y="192" width="168" height="36" rx="6" fill="url(#gBlue)"/>
  <text x="586" y="208" text-anchor="middle" font-size="11" fill="white" font-weight="bold">GET /model/info</text>
  <text x="586" y="222" text-anchor="middle" font-size="10" fill="#BEE3F8">模型状态查询</text>
  <rect x="688" y="192" width="168" height="36" rx="6" fill="url(#gBlue)"/>
  <text x="772" y="208" text-anchor="middle" font-size="11" fill="white" font-weight="bold">POST /model/reload</text>
  <text x="772" y="222" text-anchor="middle" font-size="10" fill="#BEE3F8">热重载权重</text>

  <!-- arrow to service -->
  <line x1="500" y1="238" x2="500" y2="260" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── LAYER 3: 推荐服务层 ── -->
  <rect x="60" y="263" width="880" height="72" rx="8" fill="#F0FFF4" stroke="#48BB78" stroke-width="1.5" filter="url(#s)"/>
  <text x="90" y="283" font-size="11" fill="#276749" font-weight="bold">推荐服务层（统一编排）  services/recommendation_service.py</text>
  <rect x="130" y="288" width="740" height="36" rx="6" fill="url(#gGreen)"/>
  <text x="500" y="306" text-anchor="middle" font-size="12" fill="white" font-weight="bold">get_recommendations(user_id, k)  →  特征构建 → 候选生成 → RL排序 → 解释生成 → 返回结果</text>
  <text x="500" y="319" text-anchor="middle" font-size="10" fill="#C6F6D5">统一编排全链路 · 热重载 · 延迟统计</text>

  <!-- arrows down to 4 modules -->
  <line x1="205" y1="335" x2="175" y2="370" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="335" x2="370" y2="370" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="335" x2="570" y2="370" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="780" y1="335" x2="820" y2="370" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LAYER 4: 核心算法层 ── -->
  <text x="90" y="362" font-size="11" fill="#553C9A" font-weight="bold">核心算法层</text>

  <!-- Feature Builder -->
  <rect x="65" y="373" width="195" height="78" rx="8" fill="url(#gPurple)" filter="url(#s)"/>
  <text x="162" y="394" text-anchor="middle" font-size="12" fill="white" font-weight="bold">特征构建</text>
  <text x="162" y="410" text-anchor="middle" font-size="10" fill="#E9D8FD">feature_builder.py</text>
  <text x="162" y="424" text-anchor="middle" font-size="10" fill="#E9D8FD">兴趣向量 + 历史向量</text>
  <text x="162" y="438" text-anchor="middle" font-size="10" fill="#E9D8FD">KG特征（预留）</text>

  <!-- Candidate Generator -->
  <rect x="278" y="373" width="185" height="78" rx="8" fill="url(#gTeal)" filter="url(#s)"/>
  <text x="370" y="394" text-anchor="middle" font-size="12" fill="white" font-weight="bold">候选集生成</text>
  <text x="370" y="410" text-anchor="middle" font-size="10" fill="#B2F5EA">candidate_generator.py</text>
  <text x="370" y="424" text-anchor="middle" font-size="10" fill="#B2F5EA">相似度召回 + 热门召回</text>
  <text x="370" y="438" text-anchor="middle" font-size="10" fill="#B2F5EA">混合策略 Hybrid</text>

  <!-- RL Ranker -->
  <rect x="478" y="373" width="185" height="78" rx="8" fill="url(#gOrange)" filter="url(#s)"/>
  <text x="570" y="394" text-anchor="middle" font-size="12" fill="white" font-weight="bold">RL 排序</text>
  <text x="570" y="410" text-anchor="middle" font-size="10" fill="#FEFCBF">ranker.py</text>
  <text x="570" y="424" text-anchor="middle" font-size="10" fill="#FEFCBF">Actor打分 + 语义相似度</text>
  <text x="570" y="438" text-anchor="middle" font-size="10" fill="#FEFCBF">recommend_top_k()</text>

  <!-- Explain -->
  <rect x="678" y="373" width="185" height="78" rx="8" fill="url(#gRed)" filter="url(#s)"/>
  <text x="770" y="394" text-anchor="middle" font-size="12" fill="white" font-weight="bold">推荐解释生成</text>
  <text x="770" y="410" text-anchor="middle" font-size="10" fill="#FED7D7">explain.py</text>
  <text x="770" y="424" text-anchor="middle" font-size="10" fill="#FED7D7">结构化理由 + 置信度</text>
  <text x="770" y="438" text-anchor="middle" font-size="10" fill="#FED7D7">LLM改写（预留）</text>

  <!-- ── LAYER 5: RL Core ── -->
  <line x1="570" y1="451" x2="570" y2="475" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <text x="90" y="470" font-size="11" fill="#C05621" font-weight="bold">强化学习核心</text>
  <rect x="65" y="478" width="870" height="82" rx="8" fill="#FFFAF0" stroke="#F6AD55" stroke-width="1.5" filter="url(#s)"/>

  <rect x="120" y="490" width="175" height="58" rx="6" fill="url(#gPurple)"/>
  <text x="207" y="511" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Actor 策略网络</text>
  <text x="207" y="526" text-anchor="middle" font-size="10" fill="#E9D8FD">models/actor.py</text>
  <text x="207" y="540" text-anchor="middle" font-size="10" fill="#E9D8FD">π(a|s) Softmax</text>

  <rect x="320" y="490" width="175" height="58" rx="6" fill="url(#gOrange)"/>
  <text x="407" y="511" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Critic 价值网络</text>
  <text x="407" y="526" text-anchor="middle" font-size="10" fill="#FEFCBF">models/critic.py</text>
  <text x="407" y="540" text-anchor="middle" font-size="10" fill="#FEFCBF">V(s) TD 误差</text>

  <rect x="520" y="490" width="175" height="58" rx="6" fill="url(#gGreen)"/>
  <text x="607" y="511" text-anchor="middle" font-size="12" fill="white" font-weight="bold">AC Agent</text>
  <text x="607" y="526" text-anchor="middle" font-size="10" fill="#C6F6D5">agent.py</text>
  <text x="607" y="540" text-anchor="middle" font-size="10" fill="#C6F6D5">select / update / save</text>

  <rect x="720" y="490" width="175" height="58" rx="6" fill="url(#gTeal)"/>
  <text x="807" y="511" text-anchor="middle" font-size="12" fill="white" font-weight="bold">推荐环境</text>
  <text x="807" y="526" text-anchor="middle" font-size="10" fill="#B2F5EA">env/rec_env.py</text>
  <text x="807" y="540" text-anchor="middle" font-size="10" fill="#B2F5EA">reset / step / reward</text>

  <!-- ── LAYER 6: 数据层 ── -->
  <line x1="300" y1="560" x2="200" y2="588" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,3"/>
  <line x1="807" y1="560" x2="807" y2="588" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,3"/>

  <text x="90" y="582" font-size="11" fill="#276749" font-weight="bold">数据层（可替换）</text>
  <rect x="65" y="590" width="870" height="68" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#s)"/>

  <rect x="100" y="603" width="155" height="44" rx="6" fill="#EBF8FF" stroke="#4299E1"/>
  <text x="178" y="622" text-anchor="middle" font-size="11" fill="#2B6CB0" font-weight="bold">Mock Data</text>
  <text x="178" y="637" text-anchor="middle" font-size="10" fill="#4A5568">data/mock_data.py</text>

  <rect x="275" y="603" width="155" height="44" rx="6" fill="#F0FFF4" stroke="#48BB78"/>
  <text x="353" y="622" text-anchor="middle" font-size="11" fill="#276749" font-weight="bold">MySQL / PG</text>
  <text x="353" y="637" text-anchor="middle" font-size="10" fill="#4A5568">DatabaseAdapter（预留）</text>

  <rect x="450" y="603" width="155" height="44" rx="6" fill="#FAF5FF" stroke="#9F7AEA"/>
  <text x="528" y="622" text-anchor="middle" font-size="11" fill="#553C9A" font-weight="bold">Elasticsearch</text>
  <text x="528" y="637" text-anchor="middle" font-size="10" fill="#4A5568">fetch_from_es()（预留）</text>

  <rect x="625" y="603" width="155" height="44" rx="6" fill="#FFFFF0" stroke="#F6AD55"/>
  <text x="703" y="622" text-anchor="middle" font-size="11" fill="#744210" font-weight="bold">向量数据库</text>
  <text x="703" y="637" text-anchor="middle" font-size="10" fill="#4A5568">Faiss / Milvus（预留）</text>

  <rect x="800" y="603" width="105" height="44" rx="6" fill="#FFF5F5" stroke="#FC8181"/>
  <text x="853" y="622" text-anchor="middle" font-size="11" fill="#9B2335" font-weight="bold">AMiner</text>
  <text x="853" y="637" text-anchor="middle" font-size="10" fill="#4A5568">KG Embedding（预留）</text>

  <!-- ── 奖励函数 Sidebar ── -->
  <rect x="65" y="672" width="870" height="50" rx="8" fill="#E6FFFA" stroke="#38B2AC" stroke-width="1.5"/>
  <text x="300" y="693" text-anchor="middle" font-size="11" fill="#1D4044" font-weight="bold">奖励函数（可插拔）  utils/reward.py</text>
  <text x="620" y="693" text-anchor="middle" font-size="12" fill="#276749">r = α·click + β·fav + γ·read_time + δ·topic_match + η·LTV</text>
  <text x="490" y="712" text-anchor="middle" font-size="10" fill="#4A5568">BaseRewardFunction → WeightedRewardFunction → CuriosityAugmentedReward（预留）</text>
</svg>
