<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/></filter>
    <marker id="a" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#4A5568"/></marker>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4299E1"/><stop offset="100%" stop-color="#2B6CB0"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#48BB78"/><stop offset="100%" stop-color="#276749"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9F7AEA"/><stop offset="100%" stop-color="#553C9A"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F6AD55"/><stop offset="100%" stop-color="#C05621"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F687B3"/><stop offset="100%" stop-color="#97266D"/></linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38B2AC"/><stop offset="100%" stop-color="#1D4044"/></linearGradient>
    <linearGradient id="g7" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FC8181"/><stop offset="100%" stop-color="#9B2335"/></linearGradient>
  </defs>
  <rect width="920" height="280" fill="#F7FAFC" rx="12"/>
  <text x="460" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A202C">AMiner 数据处理流水线</text>

  <!-- Boxes -->
  <!-- 1 AMiner -->
  <rect x="20" y="55" width="110" height="80" rx="10" fill="url(#g1)" filter="url(#s)"/>
  <text x="75" y="85" text-anchor="middle" font-size="12" fill="white" font-weight="bold">AMiner</text>
  <text x="75" y="101" text-anchor="middle" font-size="10" fill="#BEE3F8">papers.json</text>
  <text x="75" y="114" text-anchor="middle" font-size="10" fill="#BEE3F8">authors.json</text>
  <text x="75" y="127" text-anchor="middle" font-size="10" fill="#BEE3F8">citations.json</text>

  <!-- 2 Loader -->
  <rect x="160" y="55" width="110" height="80" rx="10" fill="url(#g2)" filter="url(#s)"/>
  <text x="215" y="82" text-anchor="middle" font-size="12" fill="white" font-weight="bold">AMiner</text>
  <text x="215" y="97" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Loader</text>
  <text x="215" y="115" text-anchor="middle" font-size="10" fill="#C6F6D5">JSON / JSONL</text>
  <text x="215" y="128" text-anchor="middle" font-size="10" fill="#C6F6D5">Paper / Author</text>

  <!-- 3 Preprocess -->
  <rect x="300" y="55" width="120" height="80" rx="10" fill="url(#g3)" filter="url(#s)"/>
  <text x="360" y="79" text-anchor="middle" font-size="12" fill="white" font-weight="bold">预处理</text>
  <text x="360" y="97" text-anchor="middle" font-size="10" fill="#E9D8FD">去重 · 过滤</text>
  <text x="360" y="110" text-anchor="middle" font-size="10" fill="#E9D8FD">文本清洗</text>
  <text x="360" y="123" text-anchor="middle" font-size="10" fill="#E9D8FD">关键词提取</text>

  <!-- 4 Embedding -->
  <rect x="450" y="55" width="120" height="80" rx="10" fill="url(#g4)" filter="url(#s)"/>
  <text x="510" y="79" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Embedding</text>
  <text x="510" y="97" text-anchor="middle" font-size="10" fill="#FEFCBF">SPECTER / Hash</text>
  <text x="510" y="110" text-anchor="middle" font-size="10" fill="#FEFCBF">PCA 降维</text>
  <text x="510" y="123" text-anchor="middle" font-size="10" fill="#FEFCBF">embeddings.npy</text>

  <!-- 5 DB Import -->
  <rect x="600" y="55" width="110" height="80" rx="10" fill="url(#g5)" filter="url(#s)"/>
  <text x="655" y="82" text-anchor="middle" font-size="12" fill="white" font-weight="bold">数据库</text>
  <text x="655" y="97" text-anchor="middle" font-size="12" fill="white" font-weight="bold">导入</text>
  <text x="655" y="115" text-anchor="middle" font-size="10" fill="#FED7E2">SQLite</text>
  <text x="655" y="128" text-anchor="middle" font-size="10" fill="#FED7E2">MySQL（预留）</text>

  <!-- 6 KG Builder -->
  <rect x="740" y="55" width="110" height="80" rx="10" fill="url(#g6)" filter="url(#s)"/>
  <text x="795" y="82" text-anchor="middle" font-size="12" fill="white" font-weight="bold">知识图谱</text>
  <text x="795" y="97" text-anchor="middle" font-size="12" fill="white" font-weight="bold">构建</text>
  <text x="795" y="115" text-anchor="middle" font-size="10" fill="#B2F5EA">节点/边构建</text>
  <text x="795" y="128" text-anchor="middle" font-size="10" fill="#B2F5EA">kg.pkl / kg.json</text>

  <!-- Arrows -->
  <line x1="130" y1="95" x2="158" y2="95" stroke="#4A5568" stroke-width="2" marker-end="url(#a)"/>
  <line x1="270" y1="95" x2="298" y2="95" stroke="#4A5568" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="95" x2="448" y2="95" stroke="#4A5568" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="95" x2="598" y2="95" stroke="#4A5568" stroke-width="2" marker-end="url(#a)"/>
  <line x1="710" y1="95" x2="738" y2="95" stroke="#4A5568" stroke-width="2" marker-end="url(#a)"/>

  <!-- Bottom output row -->
  <text x="360" y="170" text-anchor="middle" font-size="11" fill="#718096" font-weight="bold">输出产物</text>
  <text x="510" y="170" text-anchor="middle" font-size="11" fill="#718096" font-weight="bold">↓</text>
  <text x="655" y="170" text-anchor="middle" font-size="11" fill="#718096" font-weight="bold">↓</text>

  <rect x="40" y="180" width="160" height="50" rx="8" fill="white" stroke="#4299E1" stroke-width="1.5"/>
  <text x="120" y="201" text-anchor="middle" font-size="11" fill="#2B6CB0" font-weight="bold">Paper / Author 对象</text>
  <text x="120" y="218" text-anchor="middle" font-size="10" fill="#4A5568">List[Paper], List[Author]</text>

  <rect x="220" y="180" width="170" height="50" rx="8" fill="white" stroke="#9F7AEA" stroke-width="1.5"/>
  <text x="305" y="201" text-anchor="middle" font-size="11" fill="#553C9A" font-weight="bold">清洗后论文 + TF-IDF</text>
  <text x="305" y="218" text-anchor="middle" font-size="10" fill="#4A5568">过滤无效记录 · 关键词增强</text>

  <rect x="410" y="180" width="170" height="50" rx="8" fill="white" stroke="#F6AD55" stroke-width="1.5"/>
  <text x="495" y="201" text-anchor="middle" font-size="11" fill="#C05621" font-weight="bold">paper_embeddings.npy</text>
  <text x="495" y="218" text-anchor="middle" font-size="10" fill="#4A5568">shape: (N, 64) float32</text>

  <rect x="600" y="180" width="150" height="50" rx="8" fill="white" stroke="#F687B3" stroke-width="1.5"/>
  <text x="675" y="201" text-anchor="middle" font-size="11" fill="#97266D" font-weight="bold">research.db</text>
  <text x="675" y="218" text-anchor="middle" font-size="10" fill="#4A5568">paper · author · citation</text>

  <rect x="765" y="180" width="120" height="50" rx="8" fill="white" stroke="#38B2AC" stroke-width="1.5"/>
  <text x="825" y="201" text-anchor="middle" font-size="11" fill="#1D4044" font-weight="bold">KnowledgeGraph</text>
  <text x="825" y="218" text-anchor="middle" font-size="10" fill="#4A5568">节点 · 边 · 索引</text>

  <!-- vertical arrows to outputs -->
  <line x1="215" y1="135" x2="215" y2="178" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4,2"/>
  <line x1="360" y1="135" x2="305" y2="178" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4,2"/>
  <line x1="510" y1="135" x2="495" y2="178" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4,2"/>
  <line x1="655" y1="135" x2="675" y2="178" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4,2"/>
  <line x1="795" y1="135" x2="825" y2="178" stroke="#4A5568" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4,2"/>
</svg>
