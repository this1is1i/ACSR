<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A5568"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000025"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4299E1"/>
      <stop offset="100%" stop-color="#2B6CB0"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78"/>
      <stop offset="100%" stop-color="#276749"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9F7AEA"/>
      <stop offset="100%" stop-color="#553C9A"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6AD55"/>
      <stop offset="100%" stop-color="#C05621"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FC8181"/>
      <stop offset="100%" stop-color="#9B2335"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#718096"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1100" fill="#F7FAFC" rx="12"/>

  <!-- Title -->
  <text x="450" y="46" text-anchor="middle" font-size="22" font-weight="bold" fill="#1A202C">Actor–Critic 科研推荐系统</text>
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#4A5568">算法训练流程图</text>
  <line x1="80" y1="80" x2="820" y2="80" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ── 节点定义 ── -->
  <!-- 1. START -->
  <rect x="350" y="100" width="200" height="50" rx="25" fill="url(#grayGrad)" filter="url(#shadow)"/>
  <text x="450" y="131" text-anchor="middle" font-size="14" fill="white" font-weight="bold">系统初始化</text>

  <!-- 2. Reset Env -->
  <rect x="300" y="198" width="300" height="54" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="450" y="222" text-anchor="middle" font-size="13" fill="white" font-weight="bold">env.reset()</text>
  <text x="450" y="241" text-anchor="middle" font-size="11" fill="#BEE3F8">生成用户画像 + 候选科研内容集</text>

  <!-- 3. Build State -->
  <rect x="300" y="302" width="300" height="54" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="450" y="324" text-anchor="middle" font-size="13" fill="white" font-weight="bold">构建状态向量 s</text>
  <text x="450" y="343" text-anchor="middle" font-size="11" fill="#BEE3F8">兴趣向量 ‖ 历史行为向量（‖ KG特征）</text>

  <!-- 4. Actor -->
  <rect x="150" y="406" width="240" height="64" rx="10" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="270" y="430" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Actor π(a|s; θ)</text>
  <text x="270" y="450" text-anchor="middle" font-size="11" fill="#E9D8FD">Softmax → 动作概率分布</text>
  <text x="270" y="465" text-anchor="middle" font-size="11" fill="#E9D8FD">select_action() → a_t, log π(a|s)</text>

  <!-- 5. Critic -->
  <rect x="510" y="406" width="240" height="64" rx="10" fill="url(#orangeGrad)" filter="url(#shadow)"/>
  <text x="630" y="430" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Critic V(s; w)</text>
  <text x="630" y="450" text-anchor="middle" font-size="11" fill="#FEFCBF">估计当前状态价值</text>
  <text x="630" y="465" text-anchor="middle" font-size="11" fill="#FEFCBF">V(s_t) ← critic(s_t)</text>

  <!-- 6. Env Step -->
  <rect x="300" y="524" width="300" height="64" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="450" y="548" text-anchor="middle" font-size="13" fill="white" font-weight="bold">env.step(a_t)</text>
  <text x="450" y="565" text-anchor="middle" font-size="11" fill="#BEE3F8">获取用户交互信号</text>
  <text x="450" y="580" text-anchor="middle" font-size="11" fill="#BEE3F8">click / fav / read_time / topic_match</text>

  <!-- 7. Reward -->
  <rect x="300" y="642" width="300" height="64" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="450" y="664" text-anchor="middle" font-size="13" fill="white" font-weight="bold">奖励函数 r_t</text>
  <text x="450" y="683" text-anchor="middle" font-size="11" fill="#C6F6D5">r = α·click + β·fav + γ·read</text>
  <text x="450" y="698" text-anchor="middle" font-size="11" fill="#C6F6D5">    + δ·topic_match + η·LTV</text>

  <!-- 8. TD Error -->
  <rect x="250" y="760" width="400" height="64" rx="10" fill="#2D3748" filter="url(#shadow)"/>
  <text x="450" y="785" text-anchor="middle" font-size="13" fill="white" font-weight="bold">计算 TD 误差 δ_t</text>
  <text x="450" y="803" text-anchor="middle" font-size="12" fill="#90CDF4">δ_t = r_t + γ · V(s_{t+1}) − V(s_t)</text>
  <text x="450" y="818" text-anchor="middle" font-size="10" fill="#718096">（使用 s_{t+1} 的 Critic 估值，done时 γ→0）</text>

  <!-- 9. Update -->
  <!-- Critic update -->
  <rect x="100" y="878" width="290" height="70" rx="10" fill="url(#orangeGrad)" filter="url(#shadow)"/>
  <text x="245" y="902" text-anchor="middle" font-size="13" fill="white" font-weight="bold">更新 Critic</text>
  <text x="245" y="920" text-anchor="middle" font-size="11" fill="#FEFCBF">L_c = δ_t²</text>
  <text x="245" y="938" text-anchor="middle" font-size="11" fill="#FEFCBF">minimize L_c → 更新 w</text>

  <!-- Actor update -->
  <rect x="510" y="878" width="290" height="70" rx="10" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="655" y="902" text-anchor="middle" font-size="13" fill="white" font-weight="bold">更新 Actor</text>
  <text x="655" y="920" text-anchor="middle" font-size="11" fill="#E9D8FD">L_a = −log π(a|s)·δ_t − β·H(π)</text>
  <text x="655" y="938" text-anchor="middle" font-size="11" fill="#E9D8FD">maximize J → 更新 θ</text>

  <!-- 10. Done check -->
  <polygon points="450,988 560,1018 450,1048 340,1018" fill="white" stroke="#4A5568" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="1014" text-anchor="middle" font-size="13" fill="#2D3748" font-weight="bold">Episode</text>
  <text x="450" y="1032" text-anchor="middle" font-size="13" fill="#2D3748" font-weight="bold">结束？</text>

  <!-- 11. Save -->
  <rect x="630" y="1000" width="180" height="46" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="720" y="1019" text-anchor="middle" font-size="12" fill="white" font-weight="bold">保存最优模型</text>
  <text x="720" y="1036" text-anchor="middle" font-size="10" fill="#C6F6D5">agent.save_model()</text>

  <!-- ── 连接箭头 ── -->
  <!-- Start → Reset -->
  <line x1="450" y1="150" x2="450" y2="196" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Reset → State -->
  <line x1="450" y1="252" x2="450" y2="300" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>
  <!-- State → Actor -->
  <line x1="380" y1="356" x2="340" y2="404" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>
  <!-- State → Critic -->
  <line x1="520" y1="356" x2="560" y2="404" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Actor → Env Step -->
  <line x1="320" y1="470" x2="395" y2="522" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Critic → TD (via right) -->
  <line x1="630" y1="470" x2="630" y2="745" stroke="#4A5568" stroke-width="2"/>
  <line x1="630" y1="745" x2="652" y2="758" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Env Step → Reward -->
  <line x1="450" y1="588" x2="450" y2="640" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Reward → TD -->
  <line x1="450" y1="706" x2="450" y2="758" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>
  <!-- TD → Critic update -->
  <line x1="350" y1="824" x2="300" y2="876" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>
  <!-- TD → Actor update -->
  <line x1="550" y1="824" x2="600" y2="876" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Critic/Actor update → Done -->
  <line x1="245" y1="948" x2="370" y2="1010" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="655" y1="948" x2="530" y2="1010" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Done: Yes → Save -->
  <line x1="560" y1="1018" x2="628" y2="1022" stroke="#48BB78" stroke-width="2" marker-end="url(#arr)"/>
  <text x="590" y="1012" font-size="11" fill="#276749" font-weight="bold">是</text>
  <!-- Done: No → back to State (left side loop) -->
  <path d="M340 1018 Q60 1018 60 330 Q60 302 298 302" stroke="#4A5568" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="6,3"/>
  <text x="64" y="680" font-size="11" fill="#4A5568" font-weight="bold">否</text>
  <text x="30" y="695" font-size="11" fill="#4A5568">继续</text>
  <text x="30" y="710" font-size="11" fill="#4A5568">交互</text>

  <!-- ── 图例 ── -->
  <rect x="660" y="88" width="200" height="148" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="760" y="108" text-anchor="middle" font-size="12" fill="#4A5568" font-weight="bold">图例</text>
  <rect x="672" y="118" width="18" height="14" rx="3" fill="url(#blueGrad)"/>
  <text x="696" y="130" font-size="11" fill="#2D3748">环境 / 数据</text>
  <rect x="672" y="138" width="18" height="14" rx="3" fill="url(#purpleGrad)"/>
  <text x="696" y="150" font-size="11" fill="#2D3748">Actor（策略网络）</text>
  <rect x="672" y="158" width="18" height="14" rx="3" fill="url(#orangeGrad)"/>
  <text x="696" y="170" font-size="11" fill="#2D3748">Critic（价值网络）</text>
  <rect x="672" y="178" width="18" height="14" rx="3" fill="url(#greenGrad)"/>
  <text x="696" y="190" font-size="11" fill="#2D3748">奖励 / 保存</text>
  <rect x="672" y="198" width="18" height="14" rx="3" fill="#2D3748"/>
  <text x="696" y="210" font-size="11" fill="#2D3748">TD 误差计算</text>
  <line x1="672" y1="224" x2="690" y2="224" stroke="#4A5568" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="696" y="228" font-size="11" fill="#2D3748">Episode 循环回路</text>
</svg>
